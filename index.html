<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>Nine Lives</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #game { position: relative; width: 100%; height: 100%; }
    /* phones held upright: the game only fits at 1x, so ask for landscape */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #e6d8bf; color: #3a2414; font: 18px/1.5 system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) and (max-width: 700px) { #rotate { display: flex; } }
    #game canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><div>Turn your phone sideways to play<br><span style="font-size:36px">&#8635;</span></div></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>window.BUILD = "14";</script>
  <script src="sprites.js?v=14"></script>
  <script src="levels.js?v=14"></script>
  <script src="game.js?v=14"></script>
</body>
</html>
